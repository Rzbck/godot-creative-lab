name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate repository
        run: python scripts/ci/validate_repository.py

      - name: Audit temporal motion
        run: python scripts/ci/audit_temporal_motion.py

      - name: Self-test adaptive creative draw
        run: python scripts/creative/draw_recipe.py --self-test --seed 20260925

  godot-headless:
    name: Godot 4.7.1 headless
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.1"
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(godot --version)"
          echo "Godot: ${VERSION}"

          case "${VERSION}" in
            4.7.1.stable*)
              ;;
            *)
              echo "Unexpected Godot version: ${VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Import project headlessly
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log

          if grep -Eq '^\s*(SCRIPT ERROR:|ERROR:)' /tmp/godot-import.log; then
            echo "Godot reported an import/script error." >&2
            exit 1
          fi

      - name: Smoke-test main scene
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --quit-after 3 2>&1 | tee /tmp/godot-smoke.log

          if grep -Eq '^\s*(SCRIPT ERROR:|ERROR:)' /tmp/godot-smoke.log; then
            echo "Godot reported a runtime/script error." >&2
            exit 1
          fi

      - name: Verify Godot did not modify tracked files
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "Godot changed the repository:"
            git status --short
            git diff
            exit 1
          fi

          echo "Repository remains clean after Godot import and runtime smoke test."
